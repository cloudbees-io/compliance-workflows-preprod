apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name:  scan

#permissions:
#  scm-token-own: read
#  id-token: write

jobs:
  scan:
    steps:
      - name: Initiate execution plan
        uses: https://github.com/cloudbees-io/asset-chain-utils-preprod/start-chain@CBP-70041
        id: plan

      # - name: Login to AWS
      #   uses: https://github.com/cloudbees-io/configure-aws-credentials@v1
      #   id: aws-login
      #   continue-on-error: true
      #   with:
      #     aws-region: us-east-1
      #     role-to-assume: arn:aws:iam::020229604682:role/preprod-cloudbees-infra-mgmt
      #     role-duration-seconds: "3600"

      # - name: Configure container registry for Staging ECR
      #   continue-on-error: true
      #   uses: https://github.com/cloudbees-io/configure-ecr-credentials@v1
        
      - name: Cursor Inventory
        if: ${{ steps.plan.outputs.cursor-inventory == 'true' }}
        uses: docker://guide-rails:5000/assets-cursor:dev
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "MASTER"
        run: /app/plugin-cursor -mode single

      - name: Cursor Metadata
        if: ${{ steps.plan.outputs.cursor-decorator == 'true' }}
        uses: docker://guide-rails:5000/assets-cursor:dev
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "DECORATOR"
        run: /app/plugin-cursor -mode single

      - name: Gitleaks Scanner
        if: ${{ steps.plan.outputs.gitleaks == 'true' }}
        uses: docker://localhost:46027/assets-gitleaks-scanner:dev
        env:
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-gitleaks-scanner -mode single

      - name: Complete execution plan
        uses: https://github.com/cloudbees-io/asset-chain-utils-preprod/end-chain@CBP-70041
        id: process-outputs
